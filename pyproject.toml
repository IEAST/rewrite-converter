[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rewrite-converter"
version = "0.1.0"
description = "Convert a canonical rewrite manifest to Quantumult X, Loon and Shadowrocket profiles"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "rewrite-converter contributors"}]
dependencies = []

[project.scripts]
rewrite-converter = "rewrite_converter.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
